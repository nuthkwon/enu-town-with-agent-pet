name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: enu
          POSTGRES_PASSWORD: enu
          POSTGRES_DB: enu_town_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enu -d enu_town_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://enu:enu@localhost:5432/enu_town_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Policy (no server-side LLM, no committed roster)
        run: pnpm check:policy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (Postgres)
        run: pnpm test:int
      - name: Map and sprite assets are consistent
        run: pnpm sprites:build && pnpm map:check && git diff --exit-code -- apps/web/public/assets
      - name: Migrations are up to date
        run: pnpm --filter @enu/db generate && git diff --exit-code -- packages/db/migrations
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'

  images:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web, realtime and worker images
        run: |
          for t in web realtime worker; do
            docker buildx build --target "$t" -t "enu-town/$t:ci" --load .
          done
