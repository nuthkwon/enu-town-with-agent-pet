name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: enu
          POSTGRES_PASSWORD: enu
          POSTGRES_DB: enu_den_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enu -d enu_den_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://enu:enu@localhost:5432/enu_den_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Policy (no server-side LLM, no committed roster)
        run: pnpm check:policy
      - run: pnpm lint
      - name: Formatting (Prettier)
        run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Integration tests (Postgres)
        run: pnpm test:int
      - name: Map and sprite assets are consistent
        run: pnpm sprites:build && pnpm map:check && git diff --exit-code -- apps/web/public/assets
      - name: Migrations are up to date
        run: pnpm --filter @enu/db generate && git diff --exit-code -- packages/db/migrations
      - name: Pet channel plugin bundle is up to date
        run: pnpm --filter @enu/pet-channel bundle && git diff --exit-code -- claude/plugins/enu-den-channel/server
      - name: Build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: '1'

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: enu
          POSTGRES_PASSWORD: enu
          POSTGRES_DB: enu_den_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enu -d enu_den_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://enu:enu@localhost:5432/enu_den_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @enu/e2e exec playwright install --with-deps chromium
      - name: End-to-end tests (Next dev + Colyseus + Postgres)
        run: pnpm test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web, realtime and worker images
        run: |
          for t in web realtime worker; do
            docker buildx build --target "$t" -t "enu-den/$t:ci" --load .
          done
